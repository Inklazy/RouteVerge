name: Android Release

# Publishes a signed release APK whenever main moves forward.
# versionName / versionCode are read from build.gradle — this workflow never
# edits or commits version numbers, and never overwrites an existing tag,
# release or asset.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/release.jks
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD AMAP_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          if [ -z "${GOOGLE_MAPS_API_KEY}" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY is not set - the Google Maps provider will have no key in this build."
          fi

      - name: Restore release keystore
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
          test -s "$RELEASE_STORE_FILE" || { echo "::error::Keystore restore failed"; exit 1; }

      - name: Read version from Gradle
        id: version
        run: |
          set -euo pipefail
          output="$(./gradlew -q printVersionInfo --console=plain)"
          echo "$output"
          version_name="$(printf '%s\n' "$output" | sed -n 's/^VERSION_NAME=//p' | head -n1)"
          version_code="$(printf '%s\n' "$output" | sed -n 's/^VERSION_CODE=//p' | head -n1)"
          application_id="$(printf '%s\n' "$output" | sed -n 's/^APPLICATION_ID=//p' | head -n1)"
          [ -n "$version_name" ] || { echo "::error::versionName missing in build.gradle"; exit 1; }
          [ -n "$version_code" ] || { echo "::error::versionCode missing in build.gradle"; exit 1; }
          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "application_id=$application_id"
            echo "tag=v$version_name"
            echo "apk=RouteVerge-v$version_name-release.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Verify versionCode is greater than the previous release
        run: |
          set -euo pipefail
          current_code="${{ steps.version.outputs.code }}"
          current_name="${{ steps.version.outputs.name }}"

          case "$current_code" in
            ''|*[!0-9]*)
              echo "::error::versionCode from build.gradle is not numeric: '$current_code'"
              exit 1
              ;;
          esac

          previous_code=""
          previous_tag=""

          # `releases/latest` returns only published, non-draft, non-prerelease
          # releases, i.e. exactly "the previous official version".
          set +e
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null)"
          latest_status=$?
          set -e

          if [ "$latest_status" -eq 0 ] && [ -n "$previous_tag" ]; then
            previous_body="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.body' 2>/dev/null || true)"
            previous_code="$(printf '%s' "$previous_body" \
              | grep -o '<!--[[:space:]]*routeverge-version-code:[[:space:]]*[0-9]\{1,\}[[:space:]]*-->' \
              | head -n1 | grep -o '[0-9]\{1,\}' || true)"

            if [ -z "$previous_code" ]; then
              case "$previous_tag" in
                v2.1.0)
                  # Legacy official release, published before the marker existed.
                  # Derive the build number from the tagged build.gradle so the
                  # fallback stays verifiable instead of guessed.
                  previous_code="$(git show "$previous_tag:build.gradle" 2>/dev/null \
                    | sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\{1,\}\).*/\1/p' \
                    | head -n1 || true)"
                  if [ -n "$previous_code" ]; then
                    echo "Derived versionCode $previous_code from legacy tag $previous_tag."
                  else
                    previous_code="21"
                    echo "::warning::build.gradle is unreadable at $previous_tag; using the documented known versionCode 21 for that legacy release."
                  fi
                  ;;
                *)
                  echo "::error::Latest official release $previous_tag has no routeverge-version-code marker and no verifiable legacy fallback; refusing to guess."
                  exit 1
                  ;;
              esac
            fi

            case "$previous_code" in
              ''|*[!0-9]*)
                echo "::error::Previous versionCode is not numeric: '$previous_code'"
                exit 1
                ;;
            esac
            echo "Previous official release: $previous_tag (versionCode $previous_code)"
          else
            # Distinguish "repository has no release yet" (a known state) from a
            # real API failure, which must never be treated as "no previous version".
            set +e
            release_count="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq 'length' 2>/dev/null)"
            list_status=$?
            set -e
            if [ "$list_status" -eq 0 ] && [ "$release_count" = "0" ]; then
              echo "No official release exists yet; this will be the first one."
            else
              echo "::error::Cannot determine the previous official release (release list status $list_status)."
              exit 1
            fi
          fi

          if [ -n "$previous_code" ] && [ "$current_code" -le "$previous_code" ]; then
            echo "::error::versionCode must increase: build.gradle has $current_code, but the latest official release already uses $previous_code. Bump versionCode before publishing."
            exit 1
          fi
          echo "versionCode check passed: $current_code > ${previous_code:-<none>} (versionName $current_name)"
      - name: Release guard (branch, tag, release)
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only published from main (got $GITHUB_REF)."
            exit 1
          fi
          tag="${{ steps.version.outputs.tag }}"

          # `git ls-remote --exit-code` returns 2 when no ref matches, so a
          # non-zero status alone cannot distinguish "absent" from "network error".
          set +e
          ls_output="$(git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>&1)"
          ls_status=$?
          set -e
          case "$ls_status" in
            0)
              echo "::error::Tag $tag already exists on origin. Bump versionName and versionCode in build.gradle before releasing."
              exit 1
              ;;
            2)
              echo "Tag $tag does not exist yet (expected)."
              ;;
            *)
              echo "::error::Cannot verify remote tags: $ls_output"
              exit 1
              ;;
          esac

          set +e
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          release_status=$?
          set -e
          if [ "$release_status" -eq 0 ]; then
            echo "::error::Release $tag already exists; this workflow never overwrites an existing release."
            exit 1
          fi
          echo "Release guard passed for $tag."

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Run lint (release)
        run: ./gradlew lintRelease --console=plain

      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Verify APK metadata and signature
        id: apk
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "Using build-tools: $build_tools"
          source_apk="$(ls build/outputs/apk/release/*.apk | head -n1)"
          apk="${{ steps.version.outputs.apk }}"
          cp "$source_apk" "$apk"

          badging="$("$build_tools/aapt2" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | head -n1)"
          echo "$package_line"
          # Split the package line into tokens so name=/versionCode=/versionName=
          # match exactly and never the platformBuildVersion* suffixes.
          tokens="$(printf '%s\n' "$package_line" | tr ' ' '\n')"
          actual_id="$(printf '%s\n' "$tokens" | sed -n "s/^name='\([^']*\)'$/\1/p" | head -n1)"
          actual_code="$(printf '%s\n' "$tokens" | sed -n "s/^versionCode='\([^']*\)'$/\1/p" | head -n1)"
          actual_name="$(printf '%s\n' "$tokens" | sed -n "s/^versionName='\([^']*\)'$/\1/p" | head -n1)"

          [ "$actual_id" = "${{ steps.version.outputs.application_id }}" ] || { echo "::error::applicationId mismatch: $actual_id"; exit 1; }
          [ "$actual_code" = "${{ steps.version.outputs.code }}" ] || { echo "::error::versionCode mismatch: $actual_code"; exit 1; }
          [ "$actual_name" = "${{ steps.version.outputs.name }}" ] || { echo "::error::versionName mismatch: $actual_name"; exit 1; }

          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          signer_dn="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate DN: //p' | head -n1)"
          [ -n "$signer_dn" ] || { echo "::error::APK has no signer certificate"; exit 1; }
          case "$signer_dn" in
            *"CN=Android Debug"*)
              echo "::error::Refusing to publish an APK signed with the Android debug key."
              exit 1
              ;;
          esac
          echo "Signer DN: $signer_dn"

          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          size="$(stat -c%s "$apk")"
          {
            echo "sha256=$sha256"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha256"
          echo "Size: $size bytes"

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          notes="release-notes.md"
          {
            echo "## RouteVerge v$version"
            echo
            echo "### 版本信息"
            echo
            echo "- Version：$version"
            echo "- Version Code：${{ steps.version.outputs.code }}"
            echo "- Build Type：Release"
            echo "- APK：见 Release 附件"
            echo
            echo "<!-- routeverge-version-code: ${{ steps.version.outputs.code }} -->"
            echo
          } > "$notes"

          section="$(awk -v ver="$version" '
            /^##[[:space:]]*\[/ {
              if (index($0, "[" ver "]") > 0) { inside=1; next }
              if (inside) exit
            }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -n "$section" ]; then
            {
              echo "### 更新内容"
              echo
              echo "$section"
              echo
            } >> "$notes"
          else
            echo "::warning::No CHANGELOG section found for $version."
          fi

          {
            echo "### APK 校验"
            echo
            echo "SHA-256："
            echo
            echo "\`${{ steps.apk.outputs.sha256 }}\`"
            echo
            echo "- 文件名：${{ steps.version.outputs.apk }}"
            echo "- 文件大小：${{ steps.apk.outputs.size }} bytes"
            echo
            echo "### 免责声明"
            echo
            echo "本项目仅用于学习、研究和个人测试。使用者应自行遵守学校规定、平台规则、地图服务条款及当地法律法规，并自行承担使用本项目产生的风险。"
            echo
            echo "本项目不宣传或承诺用于规避学校考勤、运动规则或平台检测。"
          } >> "$notes"
          cat "$notes"

      - name: Create and push release tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "RouteVerge $tag"
          git push origin "refs/tags/$tag"

      - name: Create GitHub Release and upload APK
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.apk }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RouteVerge v${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest

      - name: Verify published release asset
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,assets > release-view.json
          cat release-view.json
          asset_name="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[0].name')"
          [ "$asset_name" = "${{ steps.version.outputs.apk }}" ] || { echo "::error::Unexpected release asset: $asset_name"; exit 1; }
          echo "Published asset: $asset_name"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RELEASE_STORE_FILE"
